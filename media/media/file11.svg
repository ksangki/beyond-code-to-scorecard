<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-label="신분 설계 대조: 매니페스트 다섯 항목과 등록 여덟 칸, 두 계층" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>신분 설계 대조: 매니페스트 다섯 항목과 등록 여덟 칸, 두 계층</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#17233A"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9C5C08"/></marker></defs><rect width="1000" height="500" fill="#F6F4EF"/><text fill="#17233A" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="24.0" y="30.0">6월 「AX를 만들다」</tspan></text><text fill="#17233A" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="560.0" y="30.0">9월 「디지털 워커의 시대」</tspan></text><line x1="24" y1="46" x2="404" y2="46" stroke="#BCC3CE" stroke-width="1.8"/><line x1="560" y1="46" x2="976" y2="46" stroke="#BCC3CE" stroke-width="1.8"/><rect x="24.0" y="66.0" width="380.0" height="100.0" rx="12" fill="#FFFFFF" stroke="#BCC3CE" stroke-width="1.8"/><text x="214.0" y="111.4" fill="#17233A" font-size="17" font-weight="700" text-anchor="middle">매니페스트 다섯 항목</text><text x="214.0" y="134.2" fill="#5A6478" font-size="14" font-weight="400" text-anchor="middle">소유자·용도·모델/도구·위험등급·통과 게이트</text><rect x="24.0" y="352.0" width="380.0" height="120.0" rx="12" fill="#FFFFFF" stroke="#BCC3CE" stroke-width="1.8"/><text x="214.0" y="396.5" fill="#17233A" font-size="17" font-weight="700" text-anchor="middle">사번 후보</text><text x="214.0" y="419.3" fill="#5A6478" font-size="14" font-weight="400" text-anchor="middle">크로스펑셔널 에이전트</text><text x="214.0" y="441.2" fill="#5A6478" font-size="14" font-weight="400" text-anchor="middle">(어시스턴트형은 도구로 둔다)</text><rect x="560.0" y="66.0" width="416.0" height="120.0" rx="12" fill="#FFFFFF" stroke="#BCC3CE" stroke-width="1.8"/><text x="768.0" y="110.5" fill="#17233A" font-size="17" font-weight="700" text-anchor="middle">등록 여덟 칸</text><text x="768.0" y="133.3" fill="#5A6478" font-size="14" font-weight="400" text-anchor="middle">마지막 칸 재심사·폐기 기준이 늘 빈다</text><text x="768.0" y="155.2" fill="#5A6478" font-size="14" font-weight="400" text-anchor="middle">첫 회차는 신원·스폰서·행위 범위만</text><rect x="560.0" y="232.0" width="416.0" height="72.0" rx="12" fill="#E2E8F1" stroke="#2F4B73" stroke-width="1.8"/><text x="768.0" y="263.4" fill="#17233A" font-size="17" font-weight="700" text-anchor="middle">1계층 식별자</text><text x="768.0" y="286.2" fill="#5A6478" font-size="14" font-weight="400" text-anchor="middle">모든 에이전트</text><rect x="560.0" y="352.0" width="416.0" height="120.0" rx="12" fill="#F6E4C4" stroke="#9C5C08" stroke-width="2.5"/><text x="768.0" y="396.5" fill="#17233A" font-size="17" font-weight="700" text-anchor="middle">2계층 사번</text><text x="768.0" y="419.3" fill="#5A6478" font-size="14" font-weight="400" text-anchor="middle">기준 넷: 연결 범위·접근 권한</text><text x="768.0" y="441.2" fill="#5A6478" font-size="14" font-weight="400" text-anchor="middle">상시 운영·절차 문서</text><path d="M410.0,116.0 L554.0,116.0" fill="none" stroke="#17233A" stroke-width="2.8" marker-end="url(#mi)"/><path d="M410.0,412.0 L554.0,412.0" fill="none" stroke="#9C5C08" stroke-width="2.8" marker-end="url(#mc)"/><path d="M768.0,190.0 L768.0,228.0" fill="none" stroke="#17233A" stroke-width="2.8" marker-end="url(#mi)"/><path d="M768.0,308.0 L768.0,348.0" fill="none" stroke="#17233A" stroke-width="2.8" marker-end="url(#mi)"/></svg>