<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-label="누가 가리고 언제 가리는가: 역할 넷과 시점 넷" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>누가 가리고 언제 가리는가: 역할 넷과 시점 넷</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#17233A"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9C5C08"/></marker></defs><rect width="1000" height="460" fill="#F6F4EF"/><text fill="#17233A" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="24.0" y="28.0">역할 넷</tspan></text><line x1="24" y1="44" x2="976" y2="44" stroke="#BCC3CE" stroke-width="1.8"/><rect x="24.0" y="60.0" width="226.0" height="150.0" rx="12" fill="#FFFFFF" stroke="#BCC3CE" stroke-width="1.8"/><text x="137.0" y="130.6" fill="#17233A" font-size="17.5" font-weight="700" text-anchor="middle">현업</text><text x="137.0" y="153.6" fill="#5A6478" font-size="14" font-weight="400" text-anchor="middle">평가셋의 주인</text><rect x="265.0" y="60.0" width="226.0" height="150.0" rx="12" fill="#FFFFFF" stroke="#BCC3CE" stroke-width="1.8"/><text x="378.0" y="130.6" fill="#17233A" font-size="17.5" font-weight="700" text-anchor="middle">독립 판정자</text><text x="378.0" y="153.6" fill="#5A6478" font-size="14" font-weight="400" text-anchor="middle">채점</text><rect x="506.0" y="60.0" width="226.0" height="150.0" rx="12" fill="#FFFFFF" stroke="#BCC3CE" stroke-width="1.8"/><text x="619.0" y="110.2" fill="#17233A" font-size="17.5" font-weight="700" text-anchor="middle">만드는 쪽</text><text x="619.0" y="133.2" fill="#5A6478" font-size="14" font-weight="400" text-anchor="middle">평가를 돌리고 채점기를 만든다</text><text x="619.0" y="155.1" fill="#5A6478" font-size="14" font-weight="400" text-anchor="middle">자기 채점기의 보정 기록지에는</text><text x="619.0" y="174.0" fill="#5A6478" fo