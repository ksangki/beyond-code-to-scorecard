l="#5A6478" font-size="14" font-weight="400" text-anchor="middle">정기 평가와 트리거 평가</text><path d="M734.0,390.0 L745.0,390.0" fill="none" stroke="#17233A" stroke-width="1.8" marker-end="url(#mi)"/><circle cx="860.0" cy="316" r="8" fill="#2F4B73"/><rect x="747.0" y="342.0" width="226.0" height="96.0" rx="12" fill="#E2E8F1" stroke="#2F4B73" stroke-width="1.8"/><text x="860.0" y="385.6" fill="#17233A" font-size="17.5" font-weight="700" text-anchor="middle">갱신</text><text x="860.0" y="408.6" fill="#5A6478" font-size="14" font-weight="400" text-anchor="middle">운영 중단 기준으로 본다</text></svg>