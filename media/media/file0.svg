ill="none" stroke="#17233A" stroke-width="1.8" marker-end="url(#mi)"/><rect x="516.0" y="344.0" width="210.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#BCC3CE" stroke-width="1.8" stroke-dasharray="7 5"/><text x="621.0" y="377.2" fill="#17233A" font-size="15.5" font-weight="700" text-anchor="middle">들이는 사람들</text><text x="621.0" y="399.0" fill="#5A6478" font-size="13.5" font-weight="400" text-anchor="middle">09-27</text><rect x="614" y="408" width="104" height="24" rx="12" fill="#E2E8F1" stroke="#2F4B73" stroke-width="1.2"/><text fill="#2F4B73" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="666.0" y="420.0">연말 공개 예정</tspan></text><text fill="#9C5C08" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="766.0" y="38.0">늦가을</tspan></text><text fill="#5A6478" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="766.0" y="64.5">10월 · 조직이 시장과 만나는</tspan><tspan x="766.0" y="83.5">자리</tspan></text><line x1="762" y1="106" x2="972" y2="106" stroke="#BCC3CE" stroke-width="1.8"/><rect x="762.0" y="132.0" width="210.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#BCC3CE" stroke-width="1.8"/><text x="867.0" y="165.2" fill="#17233A" font-size="15.5" font-weight="700" text-anchor="middle">에이전트 편집국</text><text x="867.0" y="187.0" fill="#5A6478" font-size="13.5" font-weight="400" text-anchor="middle">10-11</text><path d="M867.0,211.0 L867.0,234.0" fill="none" stroke="#17233A" stroke-width="1.8" marker-end="url(#mi)"/><rect x="762.0" y="238.0" width="210.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#BCC3CE" stroke-width="1.8"/><text x="867.0" y="260.7" fill="#17233A" font-size="15.5" font-weight="700" text-anchor="middle">조직 에이전트</text><text x="867.0" y="281.7" fill="#17233A" font-size="15.5" font-weight="700" text-anchor="middle">2027·에이전트가 사는 곳</text><text x="867.0" y="303.5" fill="#5A6478" font-size="13.5" font-weight="400" text-anchor="middle">10-24</text