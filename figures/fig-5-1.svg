<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" role="img" aria-label="J-curve 다섯 단계: 환호, 정체, 신남, 의구심, 이륙" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>J-curve 다섯 단계: 환호, 정체, 신남, 의구심, 이륙</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#17233A"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9C5C08"/></marker></defs><rect width="1000" height="230" fill="#F6F4EF"/><rect x="24.0" y="50.0" width="166.0" height="120.0" rx="12" fill="#FFFFFF" stroke="#BCC3CE" stroke-width="1.8"/><text x="107.0" y="105.8" fill="#17233A" font-size="18" font-weight="700" text-anchor="middle">① 환호</text><text x="107.0" y="128.9" fill="#5A6478" font-size="14" font-weight="400" text-anchor="middle">도구를 깔고 들뜬다</text><path d="M194.0,110.0 L216.0,110.0" fill="none" stroke="#17233A" stroke-width="2.8" marker-end="url(#mi)"/><rect x="220.0" y="50.0" width="166.0" height="120.0" rx="12" fill="#FFFFFF" stroke="#BCC3CE" stroke-width="1.8"/><text x="303.0" y="105.8" fill="#17233A" font-size="18" font-weight="700" text-anchor="middle">② 정체</text><text x="303.0" y="128.9" fill="#5A6478" font-size="14" font-weight="400" text-anchor="middle">계정은 줬는데 안 쓴다</text><path d="M390.0,110.0 L412.0,110.0" fill="none" stroke="#17233A" stroke-width="2.8" marker-end="url(#mi)"/><rect x="416.0" y="50.0" width="166.0" height="120.0" rx="12" fill="#FFFFFF" stroke="#BCC3CE" stroke-width="1.8"/><text x="499.0" y="105.8" fill="#17233A" font-size="18" font-weight="700" text-anchor="middle">③ 신남</text><text x="499.0" y="128.9" fill="#5A6478" font-size="14" font-weight="400" text-anchor="middle">사내 데이터에 붙인다</text><path d="M586.0,110.0 L608.0,110.0" fill="none" stroke="#17233A" stroke-width="2.8" marker-end="url(#mi)"/><rect x="612.0" y="50.0" width="166.0" height="120.0" rx="12" fill="#FFFFFF" stroke="#BCC3CE" stroke-width="1.8"/><text x="695.0" y="105.8" fill="#17233A" font-size="18" font-weight="700" text-anchor="middle">④ 의구심</text><text x="695.0" y="128.9" fill="#5A6478" font-size="14" font-weight="400" text-anchor="middle">빨라졌는데 더 느리다</text><path d="M782.0,110.0 L804.0,110.0" fill="none" stroke="#17233A" stroke-width="2.8" marker-end="url(#mi)"/><rect x="808.0" y="50.0" width="166.0" height="120.0" rx="12" fill="#F6E4C4" stroke="#9C5C08" stroke-width="2.5"/><text x="891.0" y="105.8" fill="#17233A" font-size="18" font-weight="700" text-anchor="middle">⑤ 이륙</text><text x="891.0" y="128.9" fill="#5A6478" font-size="14" font-weight="400" text-anchor="middle">검증을 레일에 새긴다</text></svg>