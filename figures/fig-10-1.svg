<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="사람의 네 일에서 다섯 일로: 그대로 이어진 일, 나뉘어 들어가거나 새로 더해진 일" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>사람의 네 일에서 다섯 일로: 그대로 이어진 일, 나뉘어 들어가거나 새로 더해진 일</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#17233A"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9C5C08"/></marker></defs><rect width="1000" height="560" fill="#F6F4EF"/><text x="24.0" y="26.8" fill="#17233A" font-size="16" font-weight="700" text-anchor="start">원 책 3장: 글 한 편의 흐름 안, 네 일</text><text x="676.0" y="26.8" fill="#17233A" font-size="16" font-weight="700" text-anchor="start">원 책 11장: 블로그 운영 전체, 다섯 일</text><line x1="24" y1="52" x2="354" y2="52" stroke="#BCC3CE" stroke-width="1.8"/><line x1="676" y1="52" x2="976" y2="52" stroke="#BCC3CE" stroke-width="1.8"/><rect x="676.0" y="84.0" width="300.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#BCC3CE" stroke-width="1.8"/><text x="826.0" y="121.7" fill="#17233A" font-size="18" font-weight="700" text-anchor="middle">결정</text><rect x="676.0" y="166.0" width="300.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#BCC3CE" stroke-width="1.8"/><text x="826.0" y="203.8" fill="#17233A" font-size="18" font-weight="700" text-anchor="middle">원재료</text><rect x="676.0" y="248.0" width="300.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#BCC3CE" stroke-width="1.8"/><text x="826.0" y="285.8" fill="#17233A" font-size="18" font-weight="700" text-anchor="middle">책임</text><rect x="676.0" y="330.0" width="300.0" height="62.0" rx="12" fill="#F6E4C4" stroke="#9C5C08" stroke-width="2.5"/><text x="826.0" y="367.8" fill="#17233A" font-size="18" font-weight="700" text-anchor="middle">관계</text><rect x="676.0" y="412.0" width="300.0" height="62.0" rx="12" fill=