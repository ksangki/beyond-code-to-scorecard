<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="병목의 이동: 만들 수 있는가, 무엇을 만들 것인가, 지휘하고 검증한다" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>병목의 이동: 만들 수 있는가, 무엇을 만들 것인가, 지휘하고 검증한다</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#17233A"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9C5C08"/></marker></defs><rect width="1000" height="360" fill="#F6F4EF"/><rect x="24.0" y="220.0" width="226.0" height="104.0" rx="12" fill="#FFFFFF" stroke="#BCC3CE" stroke-width="1.8"/><text x="137.0" y="267.5" fill="#17233A" font-size="18" font-weight="700" text-anchor="middle">만들 수 있는가</text><text x="137.0" y="291.1" fill="#5A6478" font-size="14.5" font-weight="400" text-anchor="middle">(구현 인력이 병목)</text><path d="M256,272.0 L286,272.0 L355,180.0 L385,180.0" fill="none" stroke="#17233A" stroke-width="2.6" marker-end="url(#mi)"/><text fill="#5A6478" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="372.5" y="246.9">AI가 실행 비용을</tspan><tspan x="372.5" y="265.1">낮춤</tspan></text><rect x="391.0" y="128.0" width="226.0" height="104.0" rx="12" fill="#FFFFFF" stroke="#BCC3CE" stroke-width="1.8"/><text x="504.0" y="175.5" fill="#17233A" font-size="18" font-weight="700" text-anchor="middle">무엇을 만들 것인가</text><text x="504.0" y="199.1" fill="#5A6478" font-size="14.5" font-weight="400" text-anchor="middle">(문제 발견이 병목)</text><path d="M623,180.0 L653,180.0 L722,88.0 L752,88.0" fill="none" stroke="#9C5C08" stroke-width="2.6" marker-end="url(#mc)"/><text fill="#5A6478" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="739.5" y="154.9">맡기는 일이</tspan><tspan x="739.5" y="173.1">늘어남</tspan></text><rect x="758.0" y="36.0" width="226.0" height="104.0" rx="12" fill="#F6E4C4" stroke="#9C5C08" stroke-width="2.5"/><text x="871.0" y="83.5" fill="#17233A" font-size="18" font-weight="700" text-anchor="middle">지휘하고 검증한다</text><text x="871.0" y="107.1" fill="#5A6478" font-size="14.5" font-weight="400" text-anchor="middle">(결과를 판단하는 사람이 병목)</text></svg>